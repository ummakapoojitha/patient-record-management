<!DOCTYPE html>
<html>
<head>
    <title>Patient Record Management</title>
</head>

<body>

<h1>Patient Record Management System</h1>

<a href="/add">Add Patient</a>

<h2>Patient Records</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Phone</th>
        <th>Disease</th>
        <th>Action</th>
    </tr>

    {% for patient in patients %}
    <tr>
        <td>{{ patient['id'] }}</td>
        <td>{{ patient['name'] }}</td>
        <td>{{ patient['age'] }}</td>
        <td>{{ patient['gender'] }}</td>
        <td>{{ patient['phone'] }}</td>
        <td>{{ patient['disease'] }}</td>
        <td>
            <a href="/edit/{{ patient['id'] }}">Edit</a>
            |
            <a href="/delete/{{ patient['id'] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
